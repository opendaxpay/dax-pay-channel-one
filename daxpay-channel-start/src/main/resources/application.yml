server:
  port: 20100

spring:
  application:
    name: daxpay-channel-one
  profiles:
    # 默认激活开发环境, 生产用 -Dspring.profiles.active=prod 或 SPRING_PROFILES_ACTIVE=prod 覆盖
    active: dev

# 通道传输 AES 加密（强制常开；key 与主应用 daxpay.channel.one.transport-encrypt.key 一致）
daxpay:
  channel:
    transport-encrypt:
      key: ${CHANNEL_TRANSPORT_KEY:0123456789abcdef0123456789abcdef}

# Mock 网关(10400 mock 子应用, 仅开发联调使用; 演示档装机由 compose 注入容器网络地址)
mock:
  gateway:
    base-url: ${MOCK_GATEWAY_BASE_URL:http://127.0.0.1:10400}

# 监控端点与链路追踪(actuator 配置必须放在顶层, 不能放在 spring: 下)
management:
  # 链路追踪(仅日志关联, 不导出到后端; 采样率 dev/prod 共享 1.0 全采样,
  # 全采样能让任意请求的日志都能用 traceId 串起来排障)
  tracing:
    sampling:
      probability: 1.0
    # OTLP 导出开关(关闭后不向 OTLP 后端推送 trace)
    export:
      otlp:
        enabled: false
  # 指标导出配置(仅本地日志关联, 不导出到 OTLP 后端)
  otlp:
    metrics:
      export:
        enabled: false
