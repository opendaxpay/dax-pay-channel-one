server:
  port: 20100

spring:
  application:
    name: daxpay-channel-one
  datasource:
    url: jdbc:postgresql://localhost:5432/daxpay_channel
    username: daxpay
    password: daxpay
    driver-class-name: org.postgresql.Driver
  jackson:
    time-zone: UTC
# 监控端点与链路追踪(仅日志关联, 不导出到后端)
management:
  endpoints:
    web:
      exposure:
        include: health,info,httpexchanges
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: false
