# ====================================================================
# 通道适配子应用 - 生产环境配置
# ====================================================================
# 部署形态: Docker Compose / 单机容器
# 启动方式: docker run -e SPRING_PROFILES_ACTIVE=prod -e DEPLOY_MODE=PROD daxpay-channel-one
# 部署模式(DEPLOY_MODE): PROD 触发 fail-fast 校验 / DEV 联调放开, 与主应用共享同值(installer 注入)
# ====================================================================
# 通道传输 AES 密钥：生产必须由环境变量注入，无默认值（与主应用 CHANNEL_ONE_TRANSPORT_KEY 同值）
daxpay:
  channel:
    transport-encrypt:
      key: ${CHANNEL_TRANSPORT_KEY}
  # 部署模式: PROD 触发启动期 fail-fast 校验(actuator 端点/health 详情), 由 installer 表单注入(DEPLOY_MODE)
  # 不显式配置时 DeploymentModeEnforcer 按 spring.profiles.active 推断(prod → PROD)
  # 与主应用联动: 共享 .env.biz 的 DEPLOY_MODE, 切换主应用模式后重启本容器自动跟随
  platform:
    deployment:
      mode: ${DEPLOY_MODE:PROD}
server:
  # 优雅停机(配合 docker stop 的 10s 宽限期)
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
# 日志(生产只输出 INFO 及以上, 业务包不切 DEBUG, 第三方框架噪音压制到 WARN)
logging:
  level:
    root: INFO
    cn.daxpay.open.**: INFO
    # 第三方框架噪音统一降级(组名对应下方 group 定义)
    framework: WARN
  group:
    # 框架与中间件包集合, 统一管理噪音级别
    framework: org.springframework, io.lettuce.core
# 监控端点(Docker Compose 场景与业务同端口, 收紧到最小必要集)
management:
  endpoints:
    web:
      exposure:
        # 不开 env/heapdump/beans 等敏感端点
        include: health,info,metrics
  endpoint:
    health:
      # 生产不暴露内部状态给未授权方
      show-details: never
      probes:
        enabled: true
      group:
        # liveness 仅看进程存活(轻量探针, 避免级联故障)
        liveness:
          include: ping
        # readiness: 无 DB 依赖, 进程存活即可接流量
        readiness:
          include: ping
